[workspace]
members = ["accounts-cli","contract", "superposition_libaccounts"]
resolver = "3"

[workspace.dependencies]
bobcat-sdk = { version = ">=0.9.6", features = ["alloc", "serde", "borsh", "panic-revert"], default-features = false }
borsh = { version = "1.5.7", default-features = false }
mini-alloc = { version = "1.0.0", default-features = false }
array-concat = "0.5.5"
const-hex = { version = "1.17.0", default-features = false, features = ["serde", "alloc"] }
superposition-assets = { version = ">=0.4.3", features = ["borsh", "serde"] }

[profile.release]
codegen-units = 1
opt-level = "z"
panic = "abort"
strip = true
lto = "fat"
debug = false
rpath = false
debug-assertions = false
incremental = false

[profile.dev]
codegen-units = 16
panic = "unwind"
opt-level = "z"
incremental = true
