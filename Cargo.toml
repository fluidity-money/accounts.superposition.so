[workspace]
members = ["accounts-cli","contract", "libaccounts", "tools/ed25519-priv-to-pub"]
resolver = "3"

[workspace.dependencies]
bobcat-sdk = { path = "/home/user/Documents/fluidity/bobcat-sdk/bobcat-sdk", features = ["alloc", "serde", "borsh", "panic-revert"] }
borsh = { version = "1.5.7", default-features = false }
mini-alloc = { version = "1.0.0", default-features = false }
ed25519-dalek = { version = "2.1.1", default-features = false, features = ["digest"] }
array-concat = "0.5.5"
const-hex = { version = "1.17.0", default-features = false, features = ["serde", "alloc"] }

[profile.release]
codegen-units = 1
opt-level = "z"
panic = "abort"
strip = true
lto = "fat"
debug = false
rpath = false
debug-assertions = false
incremental = false

[profile.dev]
codegen-units = 16
panic = "unwind"
opt-level = "z"
incremental = true
