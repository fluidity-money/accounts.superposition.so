[package]
name = "libaccounts"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]

[features]
std = ["bobcat-sdk/serde", "clap"]
panic-revert = ["bobcat-sdk/panic-revert"]
arbitrary = ["dep:arbitrary", "bobcat-sdk/arbitrary"]
alloy-enabled = ["bobcat-sdk/alloy-enabled"]

[dependencies]
array-concat.workspace = true
borsh.workspace = true
bobcat-sdk.workspace = true
clap = { version = ">=4.0.0", optional = true, features = ["derive"] }
const-hex.workspace = true
serde = { version = ">=1.0.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0.145", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10.9", default-features = false }
proptest = { version = "1.9.0", optional = true }
proptest-derive = { version = "0.7.0", optional = true }
arbitrary = { version = "1.4.2", features = ["derive"], optional = true }
